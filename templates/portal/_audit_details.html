{% comment %}Detalhes expansíveis de uma linha de auditoria (JSON legível). Variável: row.{% endcomment %}
{% if row.details %}
<details class="group text-xs">
  <summary class="inline-flex cursor-pointer list-none items-center gap-1 font-medium text-brand-600 hover:text-brand-700 [&::-webkit-details-marker]:hidden">
    {% icon "chevron-right" "size-3.5 transition-transform group-open:rotate-90" %} Ver detalhes
  </summary>
  <pre class="mt-2 max-h-64 overflow-auto rounded-lg bg-slate-900 p-3 text-[11px] leading-relaxed whitespace-pre-wrap break-words text-slate-100">{{ row.details }}</pre>
</details>
{% else %}
<span class="text-slate-400 md:inline hidden">—</span>
{% endif %}
